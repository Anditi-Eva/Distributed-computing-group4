services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  edge:
    build:
      context: ./worker_vms
      dockerfile: Dockerfile
    environment:
      NODE_ID: edge
      NODE_PORT: 5001
      NODE_CPU: 4
      NODE_MEMORY: 1024
      PEER_HOST: core
      PEER_PORT: 5002
      PROM_PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SHARED_STATE_DB: /data/shared-state.sqlite3
      FILE_STORE_DB: /files/distributed-files.sqlite3
      MAX_FILE_BYTES: 16777216
    ports:
      - "5001:5001"
    volumes:
      - edge-state:/data
      - edge-files:/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  core:
    build:
      context: ./worker_vms
      dockerfile: Dockerfile
    environment:
      NODE_ID: core
      NODE_PORT: 5002
      NODE_CPU: 8
      NODE_MEMORY: 2048
      PEER_HOST: edge
      PEER_PORT: 5001
      PROM_PORT: 8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SHARED_STATE_DB: /data/shared-state.sqlite3
      FILE_STORE_DB: /files/distributed-files.sqlite3
      MAX_FILE_BYTES: 16777216
    ports:
      - "5002:5002"
    volumes:
      - core-state:/data
      - core-files:/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  transparency-gateway:
    build:
      context: ./host_pc
      dockerfile: Dockerfile.gateway
    environment:
      TRANSPARENCY_NODES: edge=http://edge:5001,core=http://core:5002
      NAMING_DB: /data/naming.sqlite3
      MAX_FILE_BYTES: 16777216
      PORT: 5100
    volumes:
      - naming-data:/data
    ports:
      - "5100:5100"
    depends_on:
      edge:
        condition: service_healthy
      core:
        condition: service_healthy
    restart: unless-stopped

  fault-tolerance:
    build:
      context: .
      dockerfile: host_pc/Dockerfile.runner
    command: ["python", "ft_master.py", "--node", "edge=http://edge:5001", "--node", "core=http://core:5002", "--metrics-port", "9100", "--export", "/results/ft_incidents.json"]
    volumes:
      - ./host_pc/results:/workspace/host_pc/results
      - ./results:/results
    ports:
      - "9100:9100"
    depends_on:
      edge:
        condition: service_healthy
      core:
        condition: service_healthy
    restart: unless-stopped

  milestone-runner:
    profiles: ["experiments"]
    build:
      context: .
      dockerfile: host_pc/Dockerfile.runner
    command: ["python", "-c", "import time; time.sleep(10**9)"]
    volumes:
      - ./host_pc/results:/workspace/host_pc/results
      - ./results:/workspace/results

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./worker_vms/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - edge
      - core
      - transparency-gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  kafka-data:
  naming-data:
  edge-state:
  core-state:
  edge-files:
  core-files:
  prometheus-data:
  grafana-data:
