global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: edge-node
    scrape_timeout: 3s
    static_configs:
      - targets: ['192.168.56.104:8000']
        labels:
          node: Mode1-edge
          role: edge
  - job_name: core-node
    scrape_timeout: 3s
    static_configs:
      - targets: ['192.168.56.107:8000']
        labels:
          node: node2-core
          role: core
  # Milestone 7: fault-tolerance master (python ft_master.py) running on the host PC
  - job_name: ft-master
    scrape_timeout: 3s
    static_configs:
      - targets: ['host.docker.internal:9100']
        labels:
          node: host-pc
          role: master
