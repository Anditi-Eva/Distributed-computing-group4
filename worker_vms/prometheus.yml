global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: edge-node
    scrape_timeout: 3s
    static_configs:
      - targets: ['edge:8000']
        labels:
          node: Mode1-edge
          role: edge
  - job_name: core-node
    scrape_timeout: 3s
    static_configs:
      - targets: ['core:8000']
        labels:
          node: node2-core
          role: core
  # Milestone 7: fault-tolerance master running in the fault-tolerance container
  - job_name: ft-master
    scrape_timeout: 3s
    static_configs:
      - targets: ['fault-tolerance:9100']
        labels:
          node: compose-ft-master
          role: master
